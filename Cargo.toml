[package]
name = "runpod"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Unofficial async Rust client for the Runpod REST API v2"
repository = "https://github.com/safewords/rs-runpod-sdk"
exclude = ["codegen/__pycache__"]

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
wiremock = "0.6"
