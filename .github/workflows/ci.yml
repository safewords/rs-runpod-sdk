# Prove the crate: formatting, lints, every test target (unit, the mock-server
# HTTP tests, and the round trip of every example in Runpod's spec), the docs,
# that the generated code in src/api/ matches the checked-in OpenAPI document,
# and that CHANGELOG.md is valid Keep a Changelog.
#
# Public repository, so GitHub's hosted runners. release.yml calls this same
# workflow before it tags a release.
name: ci

on:
  push:
    branches: [main]
    # A change that is only documentation runs no pipeline. CHANGELOG.md is
    # not ignored: a release is a change to it.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Link with mold, as the org's other Rust builds do. Since Rust 1.90
  # linux-gnu links with the bundled rust-lld; `linker-features=-lld` turns
  # that off and `-fuse-ld=mold` has cc hand the link to mold.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld -C link-arg=-fuse-ld=mold"
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: "2G"

jobs:
  rust:
    name: cargo fmt, clippy, test, doc
    runs-on: safewords-runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
        with:
          mold-version: 3.0.0
          make-default: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  generated:
    name: src/api matches the OpenAPI document; CHANGELOG.md is valid
    runs-on: safewords-runners
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The generator formats its output with rustfmt, so the same version
      # as the rust job.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 codegen/generate.py --check
      - run: python3 scripts/changelog.py check
